<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script src="/boot-locale.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=0.4.0" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/favicon-32.webp" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Momentum — برنامه‌ریزی ماهانه دو‌زبانه برای برنامه شخصی غذا، تمرین و پیگیری پیشرفت"
    />
    <meta name="theme-color" content="#161114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link
      rel="preload"
      href="/brand/momentum-orbit-splash.svg?v=0.4.0"
      as="image"
      type="image/svg+xml"
    />
    <style id="boot-splash-critical">
      #boot-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        direction: ltr;
        text-align: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(224, 163, 200, 0.22), transparent 18rem),
          radial-gradient(circle at 55% 55%, rgba(185, 83, 58, 0.12), transparent 22rem),
          #161114;
      }

      #boot-splash .boot-splash__content {
        display: grid;
        justify-items: center;
        width: min(100%, 24rem);
        padding: 2rem;
      }

      #boot-splash .boot-splash__logo {
        display: block;
        width: 6.25rem;
        height: 6.25rem;
        border-radius: 1.95rem;
      }

      #boot-splash .boot-splash__name {
        margin: 1.35rem 0 0;
        color: #fbf5f8;
        font: 900 0.78rem/1.4 Arial, sans-serif;
        letter-spacing: 0.3em;
      }

      #boot-splash .boot-splash__tagline {
        margin: 0.5rem 0 0;
        direction: rtl;
        color: #c2b3bc;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.8;
        text-align: center;
      }

      html[lang="en"] #boot-splash .boot-splash__tagline {
        direction: ltr;
      }

      html[lang="fa"] #boot-splash .boot-splash__tagline--en,
      html[lang="en"] #boot-splash .boot-splash__tagline--fa {
        display: none;
      }

      #boot-splash .boot-splash__progress {
        display: block;
        width: 7rem;
        height: 0.2rem;
        margin-top: 1.6rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(224, 163, 200, 0.18);
      }
    </style>
    <title>Momentum — برنامه‌ریزی ماهانه حرکت‌های ماندگار</title>
  </head>
  <body>
    <div
      id="boot-splash"
      aria-label="Momentum"
      class="boot-splash"
      role="status"
    >
      <div class="boot-splash__content">
        <img
          alt=""
          aria-hidden="true"
          class="boot-splash__logo"
          src="/brand/momentum-orbit-splash.svg?v=0.4.0"
        />
        <p class="boot-splash__name">MOMENTUM</p>
        <p class="boot-splash__tagline boot-splash__tagline--fa" lang="fa">برنامه‌های ماهانه برای حرکت‌های ماندگار</p>
        <p class="boot-splash__tagline boot-splash__tagline--en" lang="en">Monthly plans for lasting momentum</p>
        <span class="boot-splash__progress"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
