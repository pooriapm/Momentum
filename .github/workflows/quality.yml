name: Quality

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_APP_COMMIT_SHA: ${{ github.sha }}

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run scan:secrets
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-dist-${{ github.sha }}
          path: |
            dist/
            storybook-static/
          retention-days: 14

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Public, preview, accessibility, and offline browser matrix
        run: npx playwright test --grep-invert "FLOW-02 terminal"
      - name: Start isolated Supabase browser fixture
        run: |
          npx supabase start
          npx supabase db reset
          echo "VITE_SUPABASE_URL=$(npx supabase status -o json | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "R2_AUTHENTICATED_E2E=1" >> "$GITHUB_ENV"
      - name: Authenticated R2 desktop release flow
        run: |
          npx supabase functions serve --env-file supabase/functions.ci.env > /tmp/momentum-functions-desktop.log 2>&1 &
          functions_pid=$!
          trap 'kill "$functions_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --output /dev/null -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "${VITE_SUPABASE_URL}/functions/v1/account-data" && break
            sleep 1
          done
          curl --fail --silent --output /dev/null -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "${VITE_SUPABASE_URL}/functions/v1/account-data"
          npx playwright test e2e/r2-authenticated-flows.spec.ts --project=chromium --workers=1
      - name: Authenticated R2 mobile release flow
        run: |
          npx supabase functions serve --env-file supabase/functions.ci.env > /tmp/momentum-functions-mobile.log 2>&1 &
          functions_pid=$!
          trap 'kill "$functions_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --output /dev/null -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "${VITE_SUPABASE_URL}/functions/v1/account-data" && break
            sleep 1
          done
          curl --fail --silent --output /dev/null -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "${VITE_SUPABASE_URL}/functions/v1/account-data"
          npx playwright test e2e/r2-authenticated-flows.spec.ts --project=mobile-chromium --workers=1
      - name: Stop isolated Supabase browser fixture
        if: always()
        run: npx supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - run: deno fmt --check supabase/functions
      - run: deno lint supabase/functions
      - run: |
          deno check \
            supabase/functions/geo-context/index.ts \
            supabase/functions/generate-monthly-plan/index.ts \
            supabase/functions/account-data/index.ts \
            supabase/functions/account-settings/index.ts \
            supabase/functions/checkins/index.ts

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase db lint
      - run: npx supabase test db
      - run: npm run test:security-rls
      - run: npm run test:auth-lifecycle
      - run: npm run test:r1-config
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  gitleaks:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
