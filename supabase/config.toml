project_id = "momentum"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://momentum.pooria-pm.workers.dev"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://momentum.pooria-pm.workers.dev/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.geo-context]
verify_jwt = false

[functions.account-data]
verify_jwt = true

[functions.checkins]
verify_jwt = true

[functions.account-settings]
verify_jwt = true

[functions.generate-monthly-plan]
verify_jwt = true
