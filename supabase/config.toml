project_id = "momentum"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://momentum.pooria-pm.workers.dev"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://momentum.pooria-pm.workers.dev/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.geo-context]
verify_jwt = false

[functions.account-data]
# Application auth verifies the bearer token with auth.getUser(). Keeping the
# gateway check off ensures CORS and structured request IDs also cover 401s.
verify_jwt = false

[functions.checkins]
verify_jwt = false

[functions.account-settings]
verify_jwt = false

[functions.generate-monthly-plan]
verify_jwt = false

[remotes.production]
project_id = "osyvvzglvyonevkhdzpu"

[remotes.production.auth.email]
max_frequency = "1m"
otp_length = 8

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.storage]
file_size_limit = "50MiB"

[remotes.production.storage.vector]
enabled = false
