project_id = "momentum"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://momentum.pooria-pm.workers.dev"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://momentum.pooria-pm.workers.dev/**",
]
jwt_expiry = 3600
enable_signup = true
# CLI accepts 6+; 8 is the recommended floor for public signup.
minimum_password_length = 8

[auth.rate_limit]
# Emails per hour when custom SMTP is enabled. Local Mailpit proofs send
# signup + resend + recovery, so this stays above 2.
email_sent = 30
# Sign-up/sign-in requests per IP per 5 minutes (CLI default 30).
sign_in_sign_ups = 15
# OTP / magic-link verifications per IP per 5 minutes (confirm + recover).
token_verifications = 15
token_refresh = 150

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# Local default is 1s so auth-lifecycle resend still works; production uses 1m.
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.geo-context]
verify_jwt = false

[functions.account-data]
# Application auth verifies the bearer token with auth.getUser(). Keeping the
# gateway check off ensures CORS and structured request IDs also cover 401s.
verify_jwt = false

[functions.checkins]
verify_jwt = false

[functions.account-settings]
verify_jwt = false

[functions.generate-monthly-plan]
verify_jwt = false

[remotes.production]
project_id = "osyvvzglvyonevkhdzpu"

[remotes.production.auth]
enable_signup = true
minimum_password_length = 8

[remotes.production.auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 15
token_verifications = 15
token_refresh = 150

[remotes.production.auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.storage]
file_size_limit = "50MiB"

[remotes.production.storage.vector]
enabled = false
